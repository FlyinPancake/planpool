[workspace]
resolver = "3"
members = [
    "crates/planpool-cli",
    "crates/planpool-server",
    "crates/planpool-types",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# The version requirement (kept in sync by release-plz) is required because
# `cargo package` rejects path-only deps, and release-plz packages each crate
# to compute diffs against the last release.
planpool-types = { path = "crates/planpool-types", version = "0.2.0" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
confroid = { version = "0.0.5", features = ["docs", "humantime", "bytesize"] }
humantime = "2"
open = "5"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

[profile.release]
lto = true
strip = true
